name: Verify Gradula
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gradula
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: gradula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gradula"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GRADULA_DB_URL: postgres://gradula:local-ci-only@localhost:5432/gradula_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run docs:check
      - run: ./web/node_modules/.bin/tsc --noEmit -p web/tsconfig.json
      - run: npm --prefix web run build
